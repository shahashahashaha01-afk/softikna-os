<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softikna OS</title>
<style>
:root{--accent:#9b5cff;--glass:rgba(19,15,42,.78);--line:#d6c1ff38;--text:#f8f4ff;--muted:#bcb2d9}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--text);font:14px Segoe UI,Arial;background:#090716}button,input,textarea,select{font:inherit}button{cursor:pointer;color:white;border:1px solid #ffffff20;background:#ffffff0c;border-radius:11px;padding:9px}button:hover{background:#ffffff1c}.primary{background:linear-gradient(120deg,#7041ff,#c042ef);border:0}a{color:#dfc6ff;text-decoration:none}.wall{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,#59249b,transparent 35%),linear-gradient(140deg,#070815,#17102f 60%,#060611)}.desktop{position:absolute;inset:0 0 58px}.icons{position:absolute;top:15px;left:12px;display:grid;gap:8px}.ico{width:85px;height:72px;border-color:transparent;background:transparent;display:grid;justify-items:center;align-content:center;gap:4px}.ico span{font-size:26px}.ico small{font-size:11px}.banner,.widget,.dock,.start,.win,.toast{background:var(--glass);backdrop-filter:blur(28px) saturate(150%);border:1px solid var(--line);box-shadow:0 20px 70px #0005}.banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:11px 15px;display:flex;align-items:center;gap:12px;width:min(450px,calc(100% - 220px));border-radius:18px}.banner b{flex:1}.muted{color:var(--muted)}.widget{position:absolute;right:15px;top:15px;padding:16px;width:185px;border-radius:19px}.clock{font-size:29px}.win{position:absolute;display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:290px;min-height:190px;max-width:calc(100vw - 15px);max-height:calc(100vh - 75px);border-radius:19px}.title{padding:10px 12px;border-bottom:1px solid #ffffff15;display:flex;gap:9px;align-items:center;cursor:grab;user-select:none}.title strong{flex:1}.title button{padding:4px 9px}.body{padding:15px;overflow:auto;flex:1}.body h2{margin:0 0 12px}.field{width:100%;padding:11px;border:1px solid #ffffff25;border-radius:11px;background:#090817b5;color:white;outline:none}.row{display:flex;gap:8px}.row .field{flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile,.file{padding:13px 5px;text-align:center;background:#ffffff0b;border:1px solid #ffffff15;border-radius:13px;cursor:pointer}.tile span,.file span{display:block;font-size:25px;margin-bottom:6px}.dock{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px 10px;border-radius:18px;z-index:10000}.dock button{font-size:21px;width:42px;height:42px;padding:0}.start{display:none;position:absolute;bottom:65px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 20px));padding:16px;border-radius:20px;z-index:10001}.start.open{display:block}.taskrow{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #ffffff13}.taskrow span:nth-child(2){flex:1}.ad{margin-top:12px;padding:11px;border:1px solid #ffffff19;border-radius:12px;background:#ffffff08}.lock{position:fixed;inset:0;z-index:30000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 40%,#59249b,transparent 38%),rgba(5,4,15,.97);backdrop-filter:blur(35px)}.lock.show{display:flex}.locktime{font-size:70px}.toast{position:absolute;right:15px;bottom:70px;display:none;padding:12px 15px;border-radius:13px;z-index:20000}.taskline{position:absolute;bottom:0;left:0;right:0;height:4px;background:#ffffff13}@media(max-width:700px){.widget{display:none}.banner{left:100px;transform:none;width:auto;right:8px}.icons{top:95px;grid-template-columns:repeat(2,75px)}.win{left:8px!important;top:155px!important;width:calc(100% - 16px)!important;height:calc(100% - 225px)!important}.dock button{width:36px;height:38px}}
</style></head><body><div class="wall" id="wall"></div><div class="desktop">
<div class="icons"><button class="ico" onclick="openApp('files')"><span>📁</span><small>Файлы</small></button><button class="ico" onclick="openApp('browser')"><span>🌐</span><small>Браузер</small></button><button class="ico" onclick="openApp('ai')"><span>🦊</span><small>Softikna AI</small></button><button class="ico" onclick="openApp('notes')"><span>📝</span><small>Блокнот</small></button><button class="ico" onclick="openApp('settings')"><span>⚙️</span><small>Настройки</small></button><button class="ico" onclick="openApp('tasks')"><span>📊</span><small>Диспетчер задач</small></button></div>
<div class="banner">✈️ <b>Подписывайся на Telegram!<br><small class="muted">Новости и обновления</small></b><button class="primary" onclick="external('https://t.me/softikna')">@softikna ↗</button></div>
<div class="widget"><div class="clock" id="clock"></div><div class="muted" id="date"></div><hr style="border-color:#ffffff18"><b>🌌 Softikna OS</b><p class="muted">Твоя система. Твой стиль.</p><a onclick="external('https://t.me/softikna')">✈ @softikna</a></div></div>
<div id="wins"></div><div class="start" id="start"><input class="field" placeholder="Поиск приложений..." oninput="renderApps(this.value)"><p class="muted">ПРИЛОЖЕНИЯ</p><div class="grid" id="appgrid"></div><div class="ad"><a onclick="external('https://t.me/softikna')">📣 Telegram @softikna</a></div></div>
<div class="dock"><button onclick="toggleStart()">⊞</button><button onclick="openApp('files')">📁</button><button onclick="openApp('browser')">🌐</button><button onclick="openApp('ai')">🦊</button><button onclick="openApp('notes')">📝</button><button onclick="openApp('calc')">🧮</button><button onclick="openApp('tasks')">📊</button><button onclick="openApp('settings')">⚙️</button><button onclick="lockScreen()">🔒</button></div><div class="taskline"></div><div id="toast" class="toast"></div>
<div class="lock" id="lock"><div class="locktime" id="locktime"></div><div id="lockdate" class="muted"></div><h2>Softikna OS</h2><p class="muted">Система заблокирована</p><div style="width:min(320px,90vw)"><input id="pin" class="field" type="password" placeholder="PIN (по умолчанию 1234)"><button class="primary" style="width:100%;margin-top:9px" onclick="unlock()">Разблокировать</button></div></div>
<script>
const defs={
files:{i:'📁',n:'Файловый менеджер',x:8,y:17,w:510,h:370,b:()=>`<h2>Файловый менеджер</h2><p class="muted">Папка Documents/Softikna OS</p><button class="primary" onclick="refreshFiles()">Обновить</button><div id="fileitems" class="grid" style="margin-top:12px"></div>`},
browser:{i:'🌐',n:'Браузер',x:40,y:17,w:460,h:360,b:()=>`<h2>Браузер</h2><p class="muted">Сайты откроются в браузере Windows.</p><form class="row" onsubmit="goUrl(event)"><input id="url" class="field" placeholder="https://example.com"><button class="primary">Открыть</button></form><div class="ad"><p><a onclick="external('https://google.com')">Google ↗</a></p><p><a onclick="external('https://youtube.com')">YouTube ↗</a></p><p><a onclick="external('https://t.me/softikna')">Telegram @softikna ↗</a></p></div>`},
ai:{i:'🦊',n:'Softikna AI',x:26,y:31,w:420,h:390,b:()=>`<h2>🦊 Softikna AI</h2><div id="chatlog" class="ad">Интерфейс готов. Чтобы отвечал настоящий ИИ, нужно указать API-маршрут твоего Cloudflare Worker.</div><form class="row" onsubmit="sendAI(event)" style="margin-top:10px"><input id="chatmsg" class="field" placeholder="Напиши сообщение..."><button class="primary">➤</button></form>`},
notes:{i:'📝',n:'Блокнот',x:32,y:22,w:410,h:390,b:()=>`<h2>Блокнот</h2><input id="notename" class="field" value="Заметка.txt"><textarea id="note" class="field" style="height:220px;margin-top:9px" placeholder="Начни писать..."></textarea><div class="row" style="margin-top:9px"><button class="primary" onclick="saveNote()">Сохранить</button><button onclick="saveFile()">В документы</button><span id="notestatus" class="muted"></span></div>`},
calc:{i:'🧮',n:'Калькулятор',x:35,y:23,w:320,h:350,b:()=>`<h2>Калькулятор</h2><input id="calcdisplay" class="field" value="0" readonly><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:10px">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(v=>`<button class="tile" onclick="calcPress('${v}')">${v}</button>`).join('')}</div>`},
settings:{i:'⚙️',n:'Настройки',x:47,y:28,w:420,h:420,b:()=>`<h2>Настройки</h2><div class="taskrow"><span>Прозрачные окна</span><input id="glass" type="checkbox" checked onchange="setGlass(this.checked)"></div><div class="taskrow"><span>Акцентный цвет</span><input id="accent" type="color" value="#9b5cff" onchange="setAccent(this.value)"></div><div class="taskrow"><span>Обои</span><select id="wallselect" class="field" style="width:150px" onchange="setWall(this.value)"><option value="purple">Фиолетовый</option><option value="blue">Синий</option><option value="pink">Розовый</option><option value="black">Чёрный</option></select></div><div class="taskrow"><span>Новый PIN</span><input id="newpin" class="field" style="width:130px" maxlength="12" placeholder="1234"></div><button class="primary" onclick="savePin()">Сохранить</button>`},
tasks:{i:'📊',n:'Диспетчер задач',x:37,y:20,w:440,h:390,b:()=>`<h2>Диспетчер задач</h2><div id="tasklist"></div><button class="primary" style="margin-top:10px" onclick="refreshTasks()">Обновить</button>`}
};let z=10,expr='',drag=null;
function openApp(id){let e=document.getElementById('win-'+id);if(e){e.style.display='flex';e.style.zIndex=++z;toggleStart(false);return}let a=defs[id];e=document.createElement('section');e.className='win';e.id='win-'+id;e.style.cssText=`left:${a.x}%;top:${a.y}%;width:${a.w}px;height:${a.h}px;z-index:${++z}`;e.innerHTML=`<div class="title" onmousedown="dragStart(event,'${id}')"><span>${a.i}</span><strong>${a.n}</strong><button onclick="minApp('${id}')">—</button><button onclick="maxApp('${id}')">□</button><button onclick="closeApp('${id}')">×</button></div><div class="body">${a.b()}</div>`;document.getElementById('wins').append(e);e.onpointerdown=()=>e.style.zIndex=++z;toggleStart(false);if(id==='notes')loadNote();if(id==='settings')loadSettings();if(id==='tasks')refreshTasks();if(id==='files')refreshFiles()}
function closeApp(id){document.getElementById('win-'+id)?.remove();if(document.getElementById('win-tasks'))refreshTasks()}function minApp(id){document.getElementById('win-'+id).style.display='none'}function maxApp(id){let e=document.getElementById('win-'+id);if(e.dataset.max){e.style.left=e.dataset.l;e.style.top=e.dataset.t;e.style.width=e.dataset.w;e.style.height=e.dataset.h;e.dataset.max=''}else{Object.assign(e.dataset,{l:e.style.left,t:e.style.top,w:e.style.width,h:e.style.height,max:'1'});Object.assign(e.style,{left:'8px',top:'8px',width:'calc(100% - 16px)',height:'calc(100% - 78px)'})}}
function dragStart(ev,id){if(ev.target.closest('button'))return;let e=document.getElementById('win-'+id);drag={e,x:ev.clientX-e.offsetLeft,y:ev.clientY-e.offsetTop};document.onmousemove=v=>{if(drag){drag.e.style.left=Math.max(0,v.clientX-drag.x)+'px';drag.e.style.top=Math.max(0,v.clientY-drag.y)+'px'}};document.onmouseup=()=>{drag=null;document.onmousemove=null}}
function toggleStart(f){let e=document.getElementById('start');e.classList.toggle('open',f===undefined?!e.classList.contains('open'):f)}function renderApps(q=''){document.getElementById('appgrid').innerHTML=Object.entries(defs).filter(([k,a])=>(k+a.n).toLowerCase().includes(q.toLowerCase())).map(([k,a])=>`<button class="tile" onclick="openApp('${k}')"><span>${a.i}</span>${a.n}</button>`).join('')}renderApps();
function external(u){window.softikna?.openExternal(u)}function goUrl(e){e.preventDefault();let u=document.getElementById('url').value.trim();if(!/^https?:\\/\\//i.test(u))u='https://'+u;try{new URL(u);external(u)}catch{notify('Проверь адрес')}}
function saveNote(){localStorage.setItem('note-name',document.getElementById('notename').value);localStorage.setItem('note-text',document.getElementById('note').value);document.getElementById('notestatus').textContent='Сохранено ✓'}function loadNote(){document.getElementById('notename').value=localStorage.getItem('note-name')||'Заметка.txt';document.getElementById('note').value=localStorage.getItem('note-text')||''}async function saveFile(){saveNote();try{let p=await window.softikna.saveTextFile(document.getElementById('notename').value,document.getElementById('note').value);notify('Файл сохранён в Documents/Softikna OS')}catch{notify('Не удалось сохранить файл')}}
async function refreshFiles(){let e=document.getElementById('fileitems');if(!e)return;let a=await window.softikna.readLocalFiles();e.innerHTML=a.length?a.map(f=>`<div class="file"><span>${f.type==='folder'?'📁':'📄'}</span>${esc(f.name)}</div>`).join(''):'<p class="muted">Пока нет файлов. Создай заметку и нажми «В документы».</p>'}
function refreshTasks(){let e=document.getElementById('tasklist');if(!e)return;let ids=Object.keys(defs).filter(k=>document.getElementById('win-'+k));e.innerHTML=ids.length?ids.map(k=>`<div class="taskrow"><span>${defs[k].i}</span><span>${defs[k].n}</span><button onclick="closeApp('${k}');refreshTasks()">Закрыть</button></div>`).join(''):'<p class="muted">Нет открытых приложений</p>'}
function loadSettings(){document.getElementById('glass').checked=localStorage.getItem('glass')!=='false';document.getElementById('accent').value=localStorage.getItem('accent')||'#9b5cff';document.getElementById('wallselect').value=localStorage.getItem('wall')||'purple'}function setGlass(v){localStorage.setItem('glass',v);document.querySelectorAll('.win').forEach(e=>{e.style.backdropFilter=v?'blur(28px) saturate(150%)':'none';e.style.background=v?'var(--glass)':'#17142b'})}function setAccent(v){localStorage.setItem('accent',v);document.documentElement.style.setProperty('--accent',v)}function setWall(v){localStorage.setItem('wall',v);applyWall(v)}function applyWall(v){document.getElementById('wall').style.background=({purple:'radial-gradient(ellipse at 50% 35%,#59249b,transparent 35%),linear-gradient(140deg,#070815,#17102f 60%,#060611)',blue:'radial-gradient(ellipse at 50% 35%,#155eaa,transparent 35%),linear-gradient(140deg,#030916,#101d3c 60%,#050611)',pink:'radial-gradient(ellipse at 50% 35%,#a52b8d,transparent 35%),linear-gradient(140deg,#100615,#30102f 60%,#060611)',black:'#050509'})[v]||'#090716'}function savePin(){let p=document.getElementById('newpin').value.trim();if(p)localStorage.setItem('pin',p);notify('Настройки сохранены ✓')}function lockScreen(){document.getElementById('lock').classList.add('show');document.getElementById('pin').value=''}function unlock(){if(document.getElementById('pin').value===(localStorage.getItem('pin')||'1234'))document.getElementById('lock').classList.remove('show');else notify('Неверный PIN')}
function calcPress(v){let d=document.getElementById('calcdisplay');if(v==='='){try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/(). -]+$/.test(s))throw 0;d.value=Function('return ('+s+')')();expr=String(d.value)}catch{d.value='Ошибка';expr=''}return}expr+=({'×':'*','÷':'/','−':'-'}[v]||v);d.value=expr||'0'}function sendAI(e){e.preventDefault();let i=document.getElementById('chatmsg'),l=document.getElementById('chatlog');if(!i.value.trim())return;l.innerHTML+=`<p><b>Ты:</b> ${esc(i.value)}</p><p><b>Softikna AI:</b> Интерфейс готов, но API пока не подключён.</p>`;i.value=''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function tick(){let d=new Date(),t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),dt=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('clock').textContent=t;document.getElementById('date').textContent=dt;document.getElementById('locktime').textContent=t;document.getElementById('lockdate').textContent=dt}setInterval(tick,1000);tick();setAccent(localStorage.getItem('accent')||'#9b5cff');applyWall(localStorage.getItem('wall')||'purple');setGlass(localStorage.getItem('glass')!=='false');openApp('files');openApp('browser');
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleStart(false);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggleStart()}});
</script></body></html>
